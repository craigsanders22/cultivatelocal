# Sveltia CMS settings. Sign-in is through GitHub.
# One-time setup is in README.md ("Editing posts and projects").
backend:
  name: github
  repo: craigsanders22/cultivatelocal
  branch: main
  base_url: https://api.netlify.com

media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads

site_url: https://cultivatelocalfood.com
display_url: https://cultivatelocalfood.com

collections:
  - name: resources
    label: Resources (articles)
    label_singular: Article
    folder: src/resources
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Short description (for Google)", name: description, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Hide (draft)", name: draft, widget: boolean, default: false, required: false }
      - { label: Article, name: body, widget: markdown }

  - name: work
    label: Work (projects)
    label_singular: Project
    folder: src/work
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Farm name, name: title, widget: string }
      - { label: "Town, State", name: place, widget: string }
      - { label: "Live site (no https://)", name: liveSite, widget: string }
      - { label: Order on page, name: order, widget: number, value_type: int }
      - { label: "One-line summary", name: summary, widget: string }
      - { label: "Short description (for Google)", name: description, widget: string }
      - { label: The farm, name: farm, widget: text }
      - { label: What they needed, name: needed, widget: text }
      - { label: What I built, name: built, widget: text }
      - { label: "How it's going (optional)", name: going, widget: text, required: false }
      - { label: Tools, name: tools, widget: string }
