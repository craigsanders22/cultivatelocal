[build]
  publish = "public/"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Long cache for fonts and images; HTML stays fresh
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
